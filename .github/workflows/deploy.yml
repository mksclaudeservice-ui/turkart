name: Publiser til GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE: /turkart/
      # Offentlige verdier: Supabase-URL og publishable key er laget for å ligge i nettleseren.
      # Tilgang styres av innlogging og Row Level Security i databasen.
      VITE_SUPABASE_URL: https://wucaivamwrnuvczrvios.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_R8cM1uORzNNqDNmFyD8U8A_L6hgfwWD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Ukjente adresser (f.eks. ved oppdatering av siden) skal også laste appen.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
